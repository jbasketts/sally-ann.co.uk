<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sally-Ann Tool Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .tool-card:hover { 
            transform: translateY(-5px); 
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }
        .tool-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">

    <!-- Centered Main Content -->
    <main class="max-w-6xl mx-auto p-6 md:p-12">
        <!-- Header -->
        <header class="flex flex-col md:flex-row md:items-center justify-between mb-12 gap-6 border-b border-slate-200 pb-8">
            <div>
                <h1 class="text-4xl font-extrabold text-slate-900 tracking-tight">Sally-Ann</h1>
                <p class="text-slate-500 mt-2 font-medium">Project Directory <code class="bg-slate-200 px-2 py-0.5 rounded text-slate-700 ml-2 text-sm font-normal">sally-ann.co.uk/</code></p>
            </div>
            <div class="flex items-center gap-4">
                <div class="bg-white px-4 py-2 rounded-full border border-slate-200 shadow-sm flex items-center text-green-600 text-sm font-semibold">
                    <span class="w-2 h-2 bg-green-500 rounded-full mr-2 animate-pulse"></span>
                    GitHub Pages Active
                </div>
            </div>
        </header>

        <!-- Tool Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            
            <!-- Binca -->
            <div class="tool-card bg-white rounded-2xl overflow-hidden border border-slate-200 cursor-pointer shadow-sm" onclick="window.open('binca/index.html', '_blank')">
                <div class="h-3 bg-sky-500 w-full"></div>
                <div class="p-8">
                    <div class="w-14 h-14 bg-sky-50 text-sky-600 rounded-2xl flex items-center justify-center mb-6">
                        <i class="fas fa-folder-open text-2xl"></i>
                    </div>
                    <h4 class="text-xl font-bold text-slate-900 mb-6">Binca</h4>
                    <div class="flex items-center justify-between border-t border-slate-50 pt-6">
                        <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Directory /binca/</span>
                        <div class="text-sky-600 font-bold text-sm group flex items-center">
                            Launch <i class="fas fa-chevron-right ml-2 transition-transform group-hover:translate-x-1"></i>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Bingo -->
            <div class="tool-card bg-white rounded-2xl overflow-hidden border border-slate-200 cursor-pointer shadow-sm" onclick="window.open('bingo/index.html', '_blank')">
                <div class="h-3 bg-indigo-500 w-full"></div>
                <div class="p-8">
                    <div class="w-14 h-14 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center mb-6">
                        <i class="fas fa-dice text-2xl"></i>
                    </div>
                    <h4 class="text-xl font-bold text-slate-900 mb-6">Bingo</h4>
                    <div class="flex items-center justify-between border-t border-slate-50 pt-6">
                        <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Directory /bingo/</span>
                        <div class="text-indigo-600 font-bold text-sm group flex items-center">
                            Launch <i class="fas fa-chevron-right ml-2 transition-transform group-hover:translate-x-1"></i>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Morse -->
            <div class="tool-card bg-white rounded-2xl overflow-hidden border border-slate-200 cursor-pointer shadow-sm" onclick="window.open('morse/index.html', '_blank')">
                <div class="h-3 bg-amber-500 w-full"></div>
                <div class="p-8">
                    <div class="w-14 h-14 bg-amber-50 text-amber-600 rounded-2xl flex items-center justify-center mb-6">
                        <i class="fas fa-signal text-2xl"></i>
                    </div>
                    <h4 class="text-xl font-bold text-slate-900 mb-6">Morse</h4>
                    <div class="flex items-center justify-between border-t border-slate-50 pt-6">
                        <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Directory /morse/</span>
                        <div class="text-amber-600 font-bold text-sm group flex items-center">
                            Launch <i class="fas fa-chevron-right ml-2 transition-transform group-hover:translate-x-1"></i>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <!-- Footer -->
        <footer class="mt-20 border-t border-slate-200 pt-8 flex flex-col md:flex-row justify-between items-center text-slate-400 text-xs gap-4">
            <p>Sally-Ann Project Directory</p>
            <div class="flex gap-6">
                <span class="text-slate-500 font-medium">Binca · Bingo · Morse</span>
            </div>
        </footer>
    </main>

</body>
</html>
