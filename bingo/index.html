<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>90 Mega Bingo Party!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@500;700&display=swap');
        
        :root {
            --primary: #ff007a;
            --secondary: #00d4ff;
            --accent: #ffcc00;
            --bg-dark: #2d0a4e;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: radial-gradient(circle at center, #4e148c 0%, #2d0a4e 100%);
            color: #fff;
            overflow-x: hidden;
        }

        h1 { font-family: 'Fredoka One', cursive; }

        .glass-panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 2rem;
        }

        .ball-drawn {
            background: linear-gradient(135deg, #ff007a 0%, #ff6600 100%);
            box-shadow: 0 0 20px rgba(255, 0, 122, 0.6);
            transform: scale(1.1);
            color: white !important;
            border-color: #ffcc00 !important;
            animation: bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes bounceIn {
            0% { transform: scale(0); }
            100% { transform: scale(1.1); }
        }

        .current-ball-container {
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .bingo-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 0.5rem;
        }

        @media (max-width: 768px) {
            .bingo-grid { grid-template-columns: repeat(5, 1fr); }
        }

        /* Fun scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }

        .btn-pop:active { transform: scale(0.95); }

        .toggle-btn {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .toggle-btn.active {
            background-color: rgba(34, 211, 238, 0.2);
            border-color: rgba(34, 211, 238, 0.5);
            color: #22d3ee;
        }
        .toggle-btn.inactive {
            background-color: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.3);
            color: #ef4444;
        }
    </style>
</head>
<body id="gameContainer" class="min-h-screen flex flex-col p-4 md:p-6">

    <!-- Header & Controls -->
    <header class="max-w-6xl mx-auto w-full flex flex-col md:flex-row justify-between items-center mb-6 gap-4 glass-panel p-6 shadow-2xl">
        <div class="text-center md:text-left">
            <h1 class="text-4xl md:text-5xl text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-yellow-300 drop-shadow-lg">
                90 MEGA BINGO ✨
            </h1>
            <p class="text-cyan-300 font-bold tracking-widest text-sm uppercase">Manual Number Caller</p>
        </div>

        <div class="flex flex-wrap justify-center gap-4 items-center">
            <button id="fullscreenBtn" onclick="toggleFullScreen()" class="bg-white/10 hover:bg-white/20 text-white p-3 rounded-xl transition-all btn-pop border border-white/10" title="Toggle Fullscreen">
                <svg id="fullscreenIcon" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
                </svg>
            </button>
            <button id="resetBtn" onclick="resetGame()" class="bg-red-500/20 hover:bg-red-500 text-white px-5 py-2 rounded-xl text-xs font-black uppercase border border-red-500/50 transition-all btn-pop">
                Reset Game
            </button>
        </div>
    </header>

    <main class="max-w-6xl mx-auto w-full grid grid-cols-1 lg:grid-cols-3 gap-8 flex-grow">
        
        <!-- Left Column: Current Ball & Local Controls -->
        <div class="lg:col-span-1 flex flex-col gap-6">
            <!-- Current Ball Display -->
            <div class="glass-panel p-10 flex flex-col items-center justify-center shadow-2xl relative overflow-hidden group">
                <div class="absolute -top-10 -right-10 w-32 h-32 bg-pink-500/20 rounded-full blur-3xl"></div>
                <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-cyan-500/20 rounded-full blur-3xl"></div>
                
                <span class="text-cyan-400 font-black text-lg mb-2 uppercase tracking-[0.2em]" id="ballLabel">Next Ball</span>
                
                <div class="current-ball-container relative">
                    <div id="currentNumber" class="text-[10rem] md:text-[13rem] font-black leading-none my-4 drop-shadow-[0_10px_10px_rgba(0,0,0,0.5)] text-white">--</div>
                </div>
                
                <div id="bingoLingo" class="text-yellow-300 font-bold text-2xl h-10 text-center animate-pulse drop-shadow-md">
                    Ready to Start!
                </div>
            </div>

            <!-- Main Draw Button -->
            <div class="flex w-full">
                <button id="drawBtn" onclick="drawBall()" class="w-full bg-gradient-to-b from-pink-400 to-pink-600 hover:from-pink-300 hover:to-pink-500 text-white font-black py-8 rounded-[2.5rem] text-5xl shadow-[0_10px_0_rgb(157,23,77)] transition-all transform active:translate-y-2 active:shadow-none btn-pop uppercase tracking-widest">
                    DRAW
                </button>
            </div>

            <!-- Audio Settings Panel (Relocated here) -->
            <div class="glass-panel p-6 border border-white/10 flex flex-col gap-4">
                <h3 class="text-xs font-black text-white/60 uppercase tracking-widest mb-1">Settings</h3>
                
                <div class="flex items-center justify-between gap-4">
                    <div class="flex items-center gap-3">
                        <div class="bg-cyan-500/20 p-2 rounded-lg">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-cyan-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
                            </svg>
                        </div>
                        <span class="text-sm font-bold">Voice Caller</span>
                    </div>
                    <button onclick="toggleVoice()" id="voiceToggle" class="toggle-btn active px-4 py-1.5 rounded-full text-[10px] font-black uppercase border">
                        ON
                    </button>
                </div>

                <div class="flex items-center justify-between gap-4">
                    <div class="flex items-center gap-3">
                        <div class="bg-pink-500/20 p-2 rounded-lg">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-pink-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3" />
                            </svg>
                        </div>
                        <span class="text-sm font-bold">Sound FX</span>
                    </div>
                    <button onclick="toggleJingle()" id="jingleToggle" class="toggle-btn active px-4 py-1.5 rounded-full text-[10px] font-black uppercase border">
                        ON
                    </button>
                </div>
            </div>

            <!-- Recent Balls List -->
            <div class="glass-panel p-5 border border-white/10">
                <h3 class="text-xs font-black text-cyan-400 uppercase mb-4 tracking-widest">Recent Calls 📜</h3>
                <div id="recentBalls" class="flex gap-3 overflow-x-auto pb-2 min-h-[60px]">
                    <!-- Recent balls -->
                </div>
            </div>
        </div>

        <!-- Right Column: Main Board -->
        <div class="lg:col-span-2 glass-panel p-8 shadow-2xl border border-white/10 flex flex-col h-full">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-2xl font-black text-white tracking-widest uppercase">Master Board</h2>
                <div class="bg-black/40 px-6 py-2 rounded-full border border-pink-500/30">
                    <span class="text-pink-400 font-black text-xl" id="calledCount">0</span>
                    <span class="text-white/40 font-bold mx-1">/</span>
                    <span class="text-white/60 font-bold">90</span>
                </div>
            </div>
            
            <div id="bingoBoard" class="bingo-grid flex-grow">
                <!-- Grid items -->
            </div>
        </div>
    </main>

    <script>
        const GAME_SIZE = 90;
        let availableNumbers = [];
        let drawnNumbers = [];
        
        let voiceEnabled = true;
        let jingleEnabled = true;
        
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        const boardEl = document.getElementById('bingoBoard');
        const currentNumEl = document.getElementById('currentNumber');
        const ballLabelEl = document.getElementById('ballLabel');
        const lingoEl = document.getElementById('bingoLingo');
        const recentBallsEl = document.getElementById('recentBalls');
        const calledCountEl = document.getElementById('calledCount');

        function initGame() {
            availableNumbers = Array.from({ length: GAME_SIZE }, (_, i) => i + 1);
            drawnNumbers = [];
            renderBoard();
            updateStats();
            
            currentNumEl.innerText = "--";
            ballLabelEl.innerText = "READY?";
            lingoEl.innerText = "90 Mega Party! 🎈";
            recentBallsEl.innerHTML = "";
        }

        function renderBoard() {
            boardEl.innerHTML = '';
            for (let i = 1; i <= GAME_SIZE; i++) {
                const cell = document.createElement('div');
                cell.id = `cell-${i}`;
                cell.className = 'bg-black/20 text-white/30 font-black h-10 md:h-12 flex items-center justify-center rounded-xl border-2 border-white/5 transition-all duration-300 text-base md:text-lg shadow-inner';
                cell.innerText = i;
                boardEl.appendChild(cell);
            }
        }

        function updateStats() {
            calledCountEl.innerText = drawnNumbers.length;
        }

        function playPopSound() {
            if (!jingleEnabled) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(440, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(110, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        function playJingle() {
            if (!jingleEnabled) return;
            const notes = [
                { freq: 523.25, time: 0 },    
                { freq: 659.25, time: 0.1 },  
                { freq: 783.99, time: 0.2 },  
                { freq: 1046.50, time: 0.3 }  
            ];
            notes.forEach(note => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(note.freq, audioCtx.currentTime + note.time);
                gain.gain.setValueAtTime(0, audioCtx.currentTime + note.time);
                gain.gain.linearRampToValueAtTime(0.15, audioCtx.currentTime + note.time + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + note.time + 0.25);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(audioCtx.currentTime + note.time);
                osc.stop(audioCtx.currentTime + note.time + 0.3);
            });
        }

        function drawBall() {
            if (audioCtx.state === 'suspended') audioCtx.resume();

            if (availableNumbers.length === 0) {
                lingoEl.innerText = "FULL HOUSE! 🏆";
                ballLabelEl.innerText = "FINISH";
                return;
            }

            const randomIndex = Math.floor(Math.random() * availableNumbers.length);
            const num = availableNumbers.splice(randomIndex, 1)[0];
            drawnNumbers.push(num);

            ballLabelEl.innerText = "NUMBER";
            currentNumEl.innerText = num;
            lingoEl.innerText = "Number " + num;

            const cell = document.getElementById(`cell-${num}`);
            if (cell) {
                const prev = document.querySelector('.last-ball-anim');
                if (prev) prev.classList.remove('last-ball-anim');
                cell.classList.add('ball-drawn', 'last-ball-anim');
            }

            const ballItem = document.createElement('div');
            ballItem.className = 'flex-shrink-0 w-12 h-12 rounded-2xl bg-gradient-to-br from-pink-500 to-purple-600 flex items-center justify-center font-black text-lg border-2 border-white/20 shadow-lg animate-bounce';
            ballItem.innerText = num;
            recentBallsEl.prepend(ballItem);

            playPopSound();
            playJingle();
            announceNumber(num);
            updateStats();
        }

        function announceNumber(num) {
            if (!voiceEnabled) return;
            const msg = new SpeechSynthesisUtterance();
            msg.text = `${num}`;
            msg.rate = 1.0;
            msg.pitch = 1.1;
            setTimeout(() => {
                if (voiceEnabled) window.speechSynthesis.speak(msg);
            }, 400);
        }

        function toggleVoice() {
            voiceEnabled = !voiceEnabled;
            const btn = document.getElementById('voiceToggle');
            btn.innerText = voiceEnabled ? 'ON' : 'OFF';
            btn.className = `toggle-btn ${voiceEnabled ? 'active' : 'inactive'} px-4 py-1.5 rounded-full text-[10px] font-black uppercase border`;
            if (!voiceEnabled) window.speechSynthesis.cancel();
        }

        function toggleJingle() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            jingleEnabled = !jingleEnabled;
            const btn = document.getElementById('jingleToggle');
            btn.innerText = jingleEnabled ? 'ON' : 'OFF';
            btn.className = `toggle-btn ${jingleEnabled ? 'active' : 'inactive'} px-4 py-1.5 rounded-full text-[10px] font-black uppercase border`;
        }

        function resetGame() {
            if (confirm("Reset the 90 Mega party? 🎈")) {
                initGame();
            }
        }

        // Fullscreen Toggle Logic
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Error attempting to enable full-screen mode: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        document.addEventListener('fullscreenchange', () => {
            const icon = document.getElementById('fullscreenIcon');
            if (document.fullscreenElement) {
                // Exit icon
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 10H4m0 0l5-5m-5 5l5 5m6-10h5m0 0l-5 5m5-5l-5-5m-6 15H4m0 0l5 5m-5-5l5-5m11 5h-5m0 0l5 5m-5-5l5-5" />';
            } else {
                // Enter icon
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />';
            }
        });

        window.onload = initGame;
    </script>
</body>
</html>
